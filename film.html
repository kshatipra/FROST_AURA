<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The little things: a 35-second illustrated film about FROST Aura.">
<style>[hidden]{display:none!important} img{max-width:100%} body{margin:0}</style>
<title>The Little Things</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one idea per screen. Paper-white editorial world with black stick-figure stories; Aura's light is the only colour.
   Flow: hook (forgotten bottle) → meet Aura (dark studio, scroll walkthrough) → who reminded you → can't my phone do that → ten stories → dashboard → made for your desk → back it. */
@property --glow{syntax:'<color>';inherits:true;initial-value:#9ED9FF}
@property --ac{syntax:'<color>';inherits:true;initial-value:#9AA0A8}
:root{
  --paper:#0B0E13;
  --paper-2:#11151C;
  --card:#151A23;
  --ink:#EEF2F7;
  --mist:#8C95A5;
  --line:#283040;
  --sub:#9AA3B2;
  --lil:#2C2648;
  --screen:#0F1319;
  --blue:#2E9BF0;
  --violet:#8A6CF2;
  --amber:#EF8F2A;
  --green:#2DB97A;
  --night:#0E1116;
  --night-2:#161A21;
  --nline:#262C36;
  --nink:#EEF2F7;
  --nmist:#8C95A5;
  --frost:#9ED9FF; --lilac:#C8B8FF; --ember:#FFBF80; --sage:#A9E8C8;
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:-.025em;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.note{font-family:var(--f-mono);font-size:11px;color:var(--mist)}

/* bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{font-family:var(--f-display);font-weight:600;letter-spacing:.32em;font-size:14px;text-decoration:none}
.nav{display:flex;gap:26px;font-size:14px}
.nav a{text-decoration:none;color:var(--mist)}
.nav a:hover{color:var(--ink)}

/* buttons */
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:190px;font-weight:600;font-size:15px;text-decoration:none;padding:12px 22px;border-radius:999px;border:1.5px solid var(--ink);cursor:pointer;transition:background .2s,color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{min-width:0;padding:7px 14px;font-size:13px}
.bar .btn{flex:none}
.mini{background:none;border:0;color:var(--mist);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;cursor:pointer;padding:6px 8px}
.mini:hover{color:var(--ink)}

/* screens */
.screen{text-align:center;padding-block:clamp(64px,10vw,128px);position:relative}
.screen h2{font-size:clamp(34px,5.4vw,64px);line-height:1.06}
.screen .sub{margin:14px auto 0;color:var(--mist);font-size:clamp(16px,1.6vw,19px);max-width:46ch}
.screen .btns{margin-top:30px}
.alt{background:var(--paper-2)}

/* ---------- stages (stick-figure scenes) ---------- */
.stage{position:relative;max-width:100%;border-radius:22px;overflow:hidden;background:var(--card);border:1.5px solid var(--ink)}
.stage svg{display:block;width:100%;height:auto}
.st{transition:--ac .8s}
.st .fl{stroke:var(--ink);stroke-width:3}
.st .pr{fill:var(--card);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.st .sf{fill:var(--paper-2);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.st .pl{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st .ink{fill:var(--ink)}
.st .thin{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.st .txt{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}
.st .hand{font-family:var(--f-hand);font-size:24px;fill:var(--ink)}
.st .fg path{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.st .fg .back{stroke:var(--sub)}
.st .fg .hd{fill:var(--card);stroke:var(--ink);stroke-width:5}
.st .fg .acl{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.st .fg .acf{fill:var(--ink)}
.st .fg .smile{stroke-width:2.5;opacity:0;transition:opacity .3s}
.st .fg .smile.on{opacity:1}
.st .fg .eyes *{fill:var(--ink);stroke:var(--ink)}
.st .fg .held path{stroke-width:3}
.st .rgs{stop-color:var(--ac)}
.st .rglow{opacity:0;transition:opacity .7s}
.st.lv1 .rglow{opacity:.45}
.st.lv2 .rglow{opacity:.6;animation:pulse 1.1s ease-in-out infinite}
.st .ab{fill:var(--card);stroke:var(--ink);stroke-width:3}
.st .ar{fill:none;stroke:var(--ac);stroke-width:3.5;opacity:.3;transition:opacity .5s}
.st.lv1 .ar,.st.lv2 .ar{opacity:1}
.st .ag{fill:none;stroke:var(--ac);stroke-width:10;filter:blur(5px);opacity:0;transition:opacity .5s}
.st.lv1 .ag{opacity:.8}
.st.lv2 .ag{opacity:1;animation:pulse 1s ease-in-out infinite}
.st .adisp{fill:#0B0E13;stroke:var(--ink);stroke-width:2}
.st .atxt{font-family:var(--f-mono);font-size:10px;fill:var(--ac);text-anchor:middle}
.st.lv0 .atxt{fill:var(--mist)}
.st .arings ellipse{fill:none;stroke:var(--ac);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.st.breath .arings ellipse{animation:ring 3s ease-out infinite}
.st.breath .arings ellipse:nth-child(2){animation-delay:1s}
.st.breath .arings ellipse:nth-child(3){animation-delay:2s}
.st .vb{fill:var(--card);stroke:var(--ink);stroke-width:3}
.st .sk{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.st .fade{transition:opacity .4s}
.st .endt{font-family:var(--f-display);font-weight:600;font-size:54px;letter-spacing:.24em;fill:var(--ink)}
.st .ends{font-family:var(--f-display);font-weight:300;font-size:34px;fill:var(--ink)}
.st .endp{font-family:var(--f-mono);font-size:16px;letter-spacing:.14em;fill:#7CC4FF}
.stage-cap{margin-top:16px;min-height:1.6em;font-family:var(--f-hand);font-size:clamp(24px,2.6vw,30px);line-height:1.2}
.stage-cap span{display:inline-block;animation:fadein .45s ease both}
.sdots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.sdots i{width:22px;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.sdots i.on{background:var(--ink)}
.ctl{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap}

/* hero */
.hero{padding-block:clamp(36px,6vw,72px) clamp(56px,8vw,96px)}
.hero h1{font-size:clamp(42px,7.4vw,96px);line-height:1;font-weight:300}
.hero h1 b{font-weight:600}
.hero .stage{width:min(940px,100%);margin:40px auto 0}

/* ---------- walkthrough (dark studio) ---------- */
.walk{background:var(--night);color:var(--nink);position:relative;transition:--glow 1s}
.walk .intro{text-align:center;padding-block:clamp(72px,10vw,120px) 24px}
.walk .intro h2{font-size:clamp(40px,7vw,88px);font-weight:300;line-height:1}
.walk .intro .sub{color:var(--nmist);margin-top:12px;font-size:clamp(17px,1.8vw,21px)}
.walk .tag{color:var(--nmist)}
.track{height:340vh;position:relative}
.skip{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:18px;font-size:13px;color:var(--nmist);text-decoration:none;z-index:2}
.skip:hover{color:var(--nink)}
.pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:radial-gradient(52% 46% at 50% 62%, color-mix(in srgb,var(--glow) 16%,transparent), transparent 72%)}
.pin::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(62% 58% at 50% 60%, transparent 35%, rgba(3,5,10,.75));opacity:0;transition:opacity 1.2s}
.pin.m-focus::after{opacity:1}
.pin > *{position:relative;z-index:1}
.chips{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.chips button{background:none;border:0;color:var(--nmist);font-size:15px;padding:8px 12px;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.chips button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chips button::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:2px;background:var(--c);transform:scaleX(0);transition:transform .35s}
.chips button[aria-selected="true"]{color:var(--nink)}
.chips button[aria-selected="true"]::after{transform:scaleX(1)}
.fcap{margin-top:14px;min-height:92px;padding-inline:16px}
.fcap h3{font-size:clamp(26px,3.8vw,46px);font-weight:400;animation:fadein .5s ease both}
.fcap p{margin-top:8px;color:var(--nmist);font-size:clamp(15px,1.5vw,18px);animation:fadein .5s .08s ease both}
.soon{display:inline-block;margin-left:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--nline);color:var(--nmist);vertical-align:middle}
.device{position:relative;width:min(820px,100%, calc((100vh - 360px) * 1.617));aspect-ratio:760/470;margin:6px auto 0;max-width:100%;transition:--glow 1s}
.device svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.halo{position:absolute;left:8%;right:38%;top:48%;bottom:-2%;border-radius:50%;background:radial-gradient(ellipse,var(--glow) 0%,transparent 65%);opacity:.35;filter:blur(24px);animation:breathe 5s ease-in-out infinite}
.ring{stroke:var(--glow)}
.ringglow{stroke:var(--glow);filter:blur(7px);animation:pulse 5s ease-in-out infinite}
.device.alert .ringglow{animation:pulse 1s ease-in-out infinite}
.vessel{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.device.lifted .vessel{transform:translate(16px,-58px) rotate(-12deg)}
.water{transition:y 1.3s cubic-bezier(.4,0,.2,1),height 1.3s cubic-bezier(.4,0,.2,1)}
.fx{position:absolute;left:-10%;top:-14%;width:120%;height:128%;pointer-events:none}
.disp{position:absolute;left:68.95%;top:22.13%;width:24.21%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;overflow:hidden;container-type:inline-size;color:var(--nink)}
.disp .face{position:absolute;inset:0;display:grid;place-content:center;gap:2px;animation:fadein .45s ease both}
.disp .big{font-family:var(--f-display);font-weight:300;font-size:24cqi;line-height:1;font-variant-numeric:tabular-nums}
.disp .small{font-family:var(--f-mono);font-size:7.5cqi;letter-spacing:.12em;text-transform:uppercase;color:var(--nmist)}
.disp .glowtxt{color:var(--glow)}
.disp .arc{position:absolute;inset:6%;transform:rotate(-90deg)}
.disp .orb{width:34cqi;height:34cqi;border-radius:50%;background:radial-gradient(circle,var(--sage),transparent 70%);margin:0 auto 4cqi;transition:transform 3.6s ease-in-out}
.disp .orb.in{transform:scale(1.8)}
.disp .bars{display:flex;gap:3cqi;align-items:end;height:30cqi;justify-content:center;margin:0 auto 4cqi}
.disp .bars i{width:5cqi;border-radius:2cqi;height:10%;transition:height .6s cubic-bezier(.4,0,.2,1)}
.walk .note{color:var(--nmist);margin-top:6px}

/* who */
.giftgrid{margin:40px auto 0;max-width:980px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;text-align:left}
.giftgrid > div{min-width:0}
.giftart svg{width:100%;height:auto;display:block}
.notemaker{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:14px;justify-items:start}
.giftnote{margin:0;font-family:var(--f-hand);font-size:clamp(26px,3vw,34px);line-height:1.25;color:var(--ink);min-height:3.8em;animation:fadein .5s ease both}
@media (max-width:760px){.giftgrid{grid-template-columns:1fr}}
.who .memory{width:min(320px,80%);margin:28px auto 0;aspect-ratio:300/200}
.who .memory svg{width:100%;height:100%;display:block}
.who .memory .draw{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease}
.who .memory.drawn .draw{stroke-dashoffset:0}
.who .memory .glassg{transition:opacity .6s}
.who .memory .aurag{opacity:0;transition:opacity .8s .2s}
.who .memory.aura .glassg{opacity:0}
.who .memory.aura .aurag{opacity:1}
.who .memory .wfill{fill:#CDE8FB;opacity:0;transition:opacity .8s .6s}
.who .memory.drawn .wfill{opacity:1}
.who-chips{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{font-size:15px;padding:9px 18px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);cursor:pointer;transition:all .2s}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.who-out{margin:22px auto 0;min-height:2.6em}
.who-out h3{font-size:clamp(24px,3.2vw,38px);font-weight:400;animation:fadein .6s ease both}
.who-out p{margin-top:8px;color:var(--mist);animation:fadein .6s .1s ease both}

/* phone vs aura */
.vs-grid{margin:40px auto 0;max-width:1060px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.vs-grid > div{min-width:0}
.vs-grid .tag{margin-bottom:10px;display:block}
.vs-line{margin-top:36px;font-size:clamp(24px,3.4vw,40px);font-family:var(--f-display);font-weight:300}
.fair{margin:56px auto 0;max-width:640px;text-align:left;border-top:1.5px solid var(--ink);padding-top:28px;display:grid;gap:12px}
.fair h3{font-size:clamp(24px,3vw,34px)}
.fair p{color:var(--mist);font-size:18px}
.fair p strong{color:var(--ink);font-weight:600}

/* stories */
.story-chips{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.story-head{margin-top:28px;min-height:96px}
.story-head h3{font-size:clamp(26px,3.6vw,44px);font-weight:400}
.story-head .tag{display:block;margin-bottom:8px}
.stories .stage{width:min(960px,100%);margin:18px auto 0}
.endcta{margin-top:12px;min-height:28px}
.endcta a{font-size:15px;font-weight:600;opacity:0;transition:opacity .4s}
.endcta a.on{opacity:1}

/* dashboard */
.dash{margin:44px auto 0;max-width:1000px;background:var(--card);border:1.5px solid var(--ink);border-radius:22px;overflow:hidden;text-align:left}
.dash-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.dash-top b{font-family:var(--f-display);font-weight:600;letter-spacing:.2em;font-size:13px}
.dash-top .chip{font-family:var(--f-mono);font-size:11px;padding:3px 10px;border-radius:999px;background:var(--paper-2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1.5px solid var(--line)}
.kpi{padding:22px 20px;border-right:1.5px solid var(--line);display:grid;gap:2px;min-width:0}
.kpi:last-child{border-right:0}
.kpi b{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,4vw,42px);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mist);font-size:14px;display:flex;align-items:center;gap:8px}
.kpi span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dash-body{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.dash-body > div{padding:20px;min-width:0}
.dash-body > div:first-child{border-right:1.5px solid var(--line)}
.dash h4{margin:0 0 10px;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--blue);transform-box:fill-box;transform-origin:bottom;transform:scaleY(.02);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.dash.in .chart .bar{transform:scaleY(1)}
.chart .bar.today{fill:var(--ink)}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--mist)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4}
.tl svg{width:100%;height:auto;display:block}
.tl text{font-family:var(--f-mono);font-size:11px;fill:var(--mist)}
.tl .m{opacity:0;transition:opacity .4s}
.dash.in .tl .m{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mist)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* desk */
.vessels3{margin:40px auto 0;max-width:820px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.vessels3 figure{margin:0;background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:12px 12px 16px;min-width:0}
.vessels3 svg{width:100%;height:auto;display:block}
.vessels3 figcaption{font-family:var(--f-display);font-size:18px}
.facts{margin:44px auto 0;max-width:980px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;text-align:left}
.facts div{background:var(--card);padding:22px 18px;display:grid;gap:6px;align-content:start;min-width:0}
.facts b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.25}
.facts span{color:var(--mist);font-size:14px}
.src{margin:14px auto 0;font-size:14px;color:var(--mist);max-width:70ch}

/* tiers */
.tiers{margin:44px auto 0;max-width:1100px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;text-align:left}
.tiers2{margin:44px auto 0;max-width:820px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:left}
.tiers2 .tier{padding:26px 24px}
.tiers2 .tier b{font-size:56px}
.tiers-more{margin:14px auto 0;max-width:820px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:center;font-size:14px;color:var(--mist)}
.tiers-more b{color:var(--ink);font-weight:600}
@media (max-width:620px){.tiers2{grid-template-columns:1fr}}
.tier{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:20px 16px;display:grid;gap:4px;align-content:start;min-width:0}
.tier.best{background:var(--ink);color:var(--paper)}
.tier .n{font-size:14px;font-weight:600}
.tier b{font-family:var(--f-display);font-weight:300;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.tier s{color:var(--mist);font-size:13px}
.tier.best s{color:#A9A6A0}
.tier span{color:var(--mist);font-size:13px}
.tier.best span{color:#C9C6C0}

/* find */

const mixHex = (a, b, t) => { const A = a.match(/\w\w/g).map(v => parseInt(v, 16)), B = b.match(/\w\w/g).map(v => parseInt(v, 16)); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
const setSky = (q, v) => { const s = q('.sky'); if (!s) return; s.setAttribute('fill', v < .5 ? mixHex('DCEBF5', 'F2C9A0', v*2) : mixHex('F2C9A0', '2B3245', (v-.5)*2)); };
const setNight = (q, v) => { const n = q('.night'); if (n) n.setAttribute('opacity', v); };
const showN = (qa, sel, n) => qa(sel).forEach(e => e.setAttribute('opacity', +e.dataset.i < n ? 1 : 0));
const op = (q, sel, v) => { const e = q(sel); if (e) e.setAttribute('opacity', v); };
const typing = (a, b, n = 6, extra = {}) => Array.from({length:n + 1}, (_, i) => ({t:i/n, pose:i % 2 ? b : a, ...extra}));
const SIP = (start, end, o = {}) => { /* reach, grab, sip, return, release, settle */
  const d = (end - start), at = f => start + d*f, x = o.x || 0, R = o.reach || 'reach', S = o.sip || 'sitSip', back = o.back || 'sitWork', tilt = o.tilt || -55, hand = o.hand;
  return [
    {t:at(0), pose:o.from || 'sitNotice', x, hand},
    {t:at(.2), pose:R, x, hold:0, hand},
    {t:at(.3), pose:R, x, hold:1, hand},
    {t:at(.55), pose:S, x, hold:1, tilt, smile:1, hand},
    {t:at(.72), pose:R, x, hold:1, smile:1, hand},
    {t:at(.8), pose:R, x, hold:0, smile:1, hand},
    {t:at(1), pose:back, x, smile:1, hand}
  ];
};

/* ---------- Stage ---------- */
let UID = 0;
class Stage {
  constructor(root, story, o = {}){
    this.root = root; this.svg = root.querySelector('svg'); this.o = o; this.uid = ++UID;
    this.q = s => this.svg.querySelector(s); this.qa = s => this.svg.querySelectorAll(s);
    this.load(story);
  }
  load(story){
    this.story = story; this.gap = this.o.gap || 0; this.D = story.scenes.map(s => s.dur * (this.o.speed || 1));
    const wc = x => (x || '').split(/\s+/).filter(Boolean).length;
    this.R = story.scenes.map(sc => this.o.narrate && sc.say ? 1 + wc(sc.say) * .36 : 0);
    const mn = this.o.minScene || 0;
    this.A = this.D.map((d, i) => Math.max(d, this.R[i] * .8, mn * .8));
    this.Lx = this.A.map((a, i) => Math.max(a, this.R[i], mn) + this.gap);
    this.T = this.Lx.reduce((a, d) => a + d, 0); this.t = 0; this.lit = -1; this.playing = false; this.lk = null; this.si = -1;
    if (this.o.dots) this.o.dots.innerHTML = story.scenes.map(() => '<i></i>').join('');
    this.render(0);
  }
  build(key){
    const L = LAYOUT[key](), u = this.uid; this.L = L; this.lk = key;
    const ves = L.vessel ? VES[L.vessel] : null;
    let s = `<defs><radialGradient id="rg${u}"><stop offset="0" class="rgs"/><stop offset="1" class="rgs" stop-opacity="0"/></radialGradient></defs>`;
    s += `<g class="lay">${L.svg.replace(/ccX/g, 'cc' + u)}</g>`;
    if (L.night) s += `<rect class="night" x="0" y="0" width="800" height="450" fill="#1C2333" opacity="0"/>`;
    if (L.dock && !L.noAura){
      const [x, y] = L.dock;
      s += `<circle class="rglow" cx="${x}" cy="${y - 40}" r="250" fill="url(#rg${u})"/>`;
      s += `<g class="aura fade" transform="translate(${x} ${y}) scale(${L.auraScale || 1.15})" ${L.auraHidden ? 'opacity="0"' : ''}>
        <g class="arings"><ellipse cx="0" cy="-3" rx="38" ry="8"/><ellipse cx="0" cy="-3" rx="38" ry="8"/><ellipse cx="0" cy="-3" rx="38" ry="8"/></g>
        <ellipse class="ag" cx="0" cy="-3" rx="40" ry="9"/>
        <ellipse class="ab" cx="0" cy="0" rx="44" ry="10"/>
        <ellipse class="ar" cx="0" cy="-2" rx="35" ry="6.5"/>
        <path class="pl" d="M32 -4 Q46 -6 50 -24"/>
        <circle class="adisp" cx="58" cy="-42" r="19"/>
        <text class="atxt" x="58" y="-38"></text></g>`;
    }
    s += `<g class="figs">${L.figs.map(f => `<g class="fg" data-f="${f.id}"><path class="back l2"/><path class="back a2"/><path class="l1"/><path class="tor"/><circle class="hd" r="${17*f.s}"/><g class="acc">${(f.acc || []).map(a => ACC[a]).join('')}<g class="eyes"></g><path class="smile"/></g><path class="a1"/><g class="held"></g></g>`).join('')}</g>`;
    if (ves) s += `<g class="vs fade" ${L.auraHidden ? 'opacity="0"' : ''}><g class="vsi">${ves.svg}</g></g>`;
    this.svg.innerHTML = s;
    this.F = L.figs.map(f => {
      const el = this.q(`.fg[data-f="${f.id}"]`), parts = {};
      ['l2','a2','l1','tor','a1'].forEach(k => parts[k] = el.querySelector('.' + k));
      return {...f, el, parts, hd:el.querySelector('.hd'), accEl:el.querySelector('.acc'), eyes:el.querySelector('.eyes'), sm:el.querySelector('.smile'), heldEl:el.querySelector('.held'), curFace:null, curHeld:null};
    });
    this.svg.style.setProperty('--ac', COL.off);
  }
  resolve(k, f){
    const g = GEN[k.pose];
    if (!g) return P[k.pose];
    const L = this.L, mid = VES[L.vessel].mid, T = [L.dock[0] - 10, L.dock[1] - 6 + mid];
    return g([(T[0] - f.a[0]) / f.s - (k.x || 0), (T[1] - f.a[1]) / f.s]);
  }
  interp(keys, p, f){
    let i = 0; while (i < keys.length - 2 && p > keys[i+1].t) i++;
    const k0 = keys[i], k1 = keys[Math.min(i+1, keys.length - 1)];
    const u = (k1 === k0 || k1.t === k0.t) ? 0 : ease(clamp01((p - k0.t) / (k1.t - k0.t)));
    const A = this.resolve(k0, f), B = this.resolve(k1, f), pts = {};
    for (const key in A) pts[key] = lp(A[key], B[key] || A[key], u);
    const kk = u > .5 ? k1 : k0;
    return {pts, x:lerp(k0.x || 0, k1.x || 0, u), hold:lerp(k0.hold || 0, k1.hold || 0, u), tilt:lerp(k0.tilt || 0, k1.tilt || 0, u),
      held:kk.held || 'none', face:kk.face, smile:kk.smile, hand:k0.hand || 'w1'};
  }
  drawFig(f, st){
    const s = f.s, A = f.a, P_ = st.pts, w = {};
    for (const k in P_) w[k] = [A[0] + (P_[k][0] + st.x) * s, A[1] + P_[k][1] * s];
    const sh = lp(w.n, w.p, .14), m = a => `${a[0].toFixed(1)} ${a[1].toFixed(1)}`;
    f.parts.tor.setAttribute('d', `M${m(w.n)} L${m(w.p)}`);
    f.parts.a1.setAttribute('d', `M${m(sh)} L${m(w.e1)} L${m(w.w1)}`);
    f.parts.a2.setAttribute('d', `M${m(sh)} L${m(w.e2)} L${m(w.w2)}`);
    f.parts.l1.setAttribute('d', `M${m(w.p)} L${m(w.k1)} L${m(w.f1)}`);
    f.parts.l2.setAttribute('d', `M${m(w.p)} L${m(w.k2)} L${m(w.f2)}`);
    f.hd.setAttribute('cx', w.h[0]); f.hd.setAttribute('cy', w.h[1]);
    f.accEl.setAttribute('transform', `translate(${m(w.h)}) scale(${s})`);
    const face = st.face || f.face || 'r';
    if (f.curFace !== face){ f.curFace = face; f.eyes.innerHTML = EYES[face]; f.sm.setAttribute('d', SMILE[face]); }
    const sm = st.smile !== undefined ? st.smile : f.smile; f.sm.classList.toggle('on', !!sm);
    if (f.curHeld !== st.held){ f.curHeld = st.held; f.heldEl.innerHTML = HELD[st.held].svg; }
    const H = HELD[st.held]; if (H.at) f.heldEl.setAttribute('transform', `translate(${m(w[H.at])}) scale(${s})`);
    return w;
  }
  sceneAt(t){
    let acc = 0; const S = this.story.scenes;
    for (let i = 0; i < S.length; i++){ if (t < acc + this.Lx[i] || i === S.length - 1) return [i, clamp01((t - acc) / this.A[i]), t - acc]; acc += this.Lx[i]; }
  }
  render(t){
    const [i, p, tl] = this.sceneAt(t), sc = this.story.scenes[i];
    const key = sc.L || this.story.L;
    if (key !== this.lk) this.build(key);
    if (this.L.dock && !this.L.noAura){
      let a = sc.aura || {c:'off', lv:0, txt:''};
      if (Array.isArray(a)) a = a.filter(x => x.t <= p).pop() || a[0];
      this.svg.style.setProperty('--ac', COL[a.c || 'off']);
      this.svg.classList.remove('lv0','lv1','lv2'); this.svg.classList.add('lv' + (a.lv || 0));
      this.svg.classList.toggle('breath', !!a.breath);
      const tx = typeof a.txt === 'function' ? a.txt(p) : (a.txt || '');
      const te = this.q('.atxt'); if (te.textContent !== tx) te.textContent = tx;
    } else { this.svg.classList.remove('lv1','lv2','breath'); }
    let mainW = null, mainSt = null;
    this.F.forEach(f => {
      const keys = (sc.keys || {})[f.id] || [{t:0, pose:f.id === 'kid' ? 'stand' : 'sitWork'}];
      const st = this.interp(keys, p, f), w = this.drawFig(f, st);
      if (f.id === 'main'){ mainW = w; mainSt = st; }
    });
    if (this.L.vessel){
      const ves = VES[this.L.vessel], vs = this.L.vesselScale || 1, d = [this.L.dock[0], this.L.dock[1] - (6 - ves.mid) * vs];
      const hold = mainSt ? mainSt.hold : 0, hand = mainW ? (mainW[mainSt.hand] || mainW.w1) : d, pos = lp(d, hand, hold), tilt = mainSt ? mainSt.tilt * hold : 0;
      this.q('.vsi').setAttribute('transform', `translate(${pos[0].toFixed(1)} ${pos[1].toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(${vs}) translate(0 ${-ves.mid})`);
    }
    if (sc.tick) sc.tick(this.q, p, this.qa);
    if (i !== this.si){
      this.si = i;
      if (this.o.cap) this.o.cap.innerHTML = `<span>${(this.o.narrate && sc.say) || sc.cap || ''}</span>`;
      if (this.o.dots) [...this.o.dots.children].forEach((d, j) => d.classList.toggle('on', j <= i));
      if (this.o.sub){ this.o.sub.innerHTML = (sc.say || sc.cap || '').split(/\s+/).map(w => `<span>${w}</span>`).join(' '); this.lit = -1; }
    }
    if (this.o.sub){
      const ws = this.o.sub.children, n = ws.length, k = this.R[i] ? Math.ceil(clamp01(tl / Math.max(.5, this.R[i] - .6)) * n) : n;
      if (k !== this.lit){ for (let j = 0; j < n; j++) ws[j].classList.toggle('lit', j < k); this.lit = k; }
    }
  }
  play(){
    if (REDUCE){ this.t = this.T; this.render(this.T - .001); if (this.o.onEnd) this.o.onEnd(); return; }
    if (this.t >= this.T){ this.t = 0; this.si = -1; }
    this.playing = true; let last = performance.now();
    const step = now => {
      if (!this.playing) return;
      this.t = Math.min(this.T, this.t + (now - last) / 1000); last = now;
      this.render(Math.min(this.t, this.T - .001));
      if (this.t >= this.T){ this.playing = false; if (this.o.onEnd) this.o.onEnd(); return; }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  pause(){ this.playing = false; }
  replay(){ this.pause(); this.t = 0; this.si = -1; this.render(0); this.play(); }
  seek(i){ let t = 0; for (let j = 0; j < i; j++) t += this.Lx[j]; this.t = t; this.si = -1; this.render(t + .001); }
}

<script>
(() => {
  const $ = id => document.getElementById(id);
  const film = new Stage($('filmStage'), FILM, {cap:$('filmCap'), sub:$('filmSub'), dots:$('filmDots'), narrate:true, gap:.6, speed:1, minScene:5.2, onEnd:() => { $('filmPlay').textContent = '▶ PLAY'; }});
  const lab = () => $('filmPlay').textContent = film.playing ? '❚❚ PAUSE' : '▶ PLAY';
  setTimeout(() => { film.play(); lab(); }, 600);
  $('filmPlay').addEventListener('click', () => { film.playing ? film.pause() : film.play(); lab(); });
  $('filmReplay').addEventListener('click', () => { film.replay(); lab(); });
  $('filmDots').addEventListener('click', e => { const i = [...$('filmDots').children].indexOf(e.target); if (i >= 0){ film.seek(i); if (!film.playing) film.play(); lab(); } });
})();
</script>
